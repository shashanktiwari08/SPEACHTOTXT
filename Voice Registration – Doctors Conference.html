<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Registration – Doctors Conference</title>
<style>
:root{--bg:#f3f7f6;--ink:#10302c;--mut:#5b7672;--card:#fff;--line:#cfe0dd;--acc:#0e7c72;--acc2:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a19;--ink:#e6f2f0;--mut:#8fb0ab;--card:#142625;--line:#25413e;--acc:#34c3b4;--acc2:#fb923c}}
:root[data-theme="dark"]{--bg:#0d1a19;--ink:#e6f2f0;--mut:#8fb0ab;--card:#142625;--line:#25413e;--acc:#34c3b4;--acc2:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Georgia,serif;font-size:1.7rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.prompt{font-size:1.25rem;font-weight:600;min-height:2.2em}
.field{margin-top:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input{width:100%;font-size:1.3rem;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input.active{border-color:var(--acc)}
.mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:18px;font-size:1.2rem;font-weight:700;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer}
.mic.live{background:var(--acc2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.row{display:flex;gap:10px;margin-top:12px}
button.sec{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.heard{color:var(--mut);font-size:.9rem;min-height:1.4em;margin-top:8px}
.ok{color:var(--acc);font-weight:600}
h2{font-size:1.1rem;margin:28px 0 8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<main>
<h1>Conference registration</h1>
<p class="sub">Tap the button and speak. You can fix any field by typing.</p>

<div class="card">
  <div class="prompt" id="prompt">Tap “Start” to register.</div>
  <div class="field"><label for="name">Name</label><input id="name" autocomplete="off"></div>
  <div class="field"><label for="phone">Phone number</label><input id="phone" inputmode="tel" autocomplete="off"></div>
  <div class="heard" id="heard"></div>
  <button class="mic" id="mic">🎤 Start</button>
  <div class="row">
    <button class="sec" id="save">Save registration</button>
    <button class="sec" id="clear">Clear</button>
  </div>
</div>

<h2>Registered (<span id="count">0</span>)</h2>
<div class="row" style="margin-top:0">
  <button class="sec" id="csv">Download CSV</button>
</div>
<div class="tw"><table><thead><tr><th>Name</th><th>Phone</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>

<script>
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let list=[];try{list=JSON.parse(localStorage.getItem('reg')||'[]')}catch(e){}
let step=0,rec=null,live=false;

const words={zero:0,oh:0,o:0,one:1,two:2,to:2,too:2,three:3,four:4,for:4,five:5,six:6,seven:7,eight:8,ate:8,nine:9};
function digits(t){
  let out='';
  t.toLowerCase().replace(/double (\w+)/g,(m,w)=>w+' '+w).split(/[\s,.-]+/).forEach(w=>{
    if(/^\d+$/.test(w))out+=w;else if(w in words)out+=words[w];
  });
  return out;
}
function cleanName(t){
  return t.replace(/^(my name is|i am|i'm|this is|it's|it is)\s+/i,'').replace(/[.]/g,'').trim()
    .replace(/\b\w/g,c=>c.toUpperCase());
}
function say(t){
  $('prompt').textContent=t;
  try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}
}
function render(){
  $('count').textContent=list.length;
  $('rows').innerHTML=list.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.time)}</td></tr>`).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function persist(){try{localStorage.setItem('reg',JSON.stringify(list))}catch(e){}}

function listen(){
  if(!SR){$('heard').textContent='Voice input is not supported in this browser. Please use Chrome or Edge, or type below.';return}
  rec=new SR();rec.lang='en-IN';rec.interimResults=true;rec.continuous=false;
  const f=step===1?$('name'):$('phone');
  $('name').classList.toggle('active',step===1);$('phone').classList.toggle('active',step===2);
  rec.onstart=()=>{live=true;$('mic').classList.add('live');$('mic').textContent='🎙 Listening… tap to stop'};
  rec.onresult=e=>{
    let t='';for(const r of e.results)t+=r[0].transcript;
    $('heard').textContent='Heard: '+t;
    f.value=step===1?cleanName(t):digits(t);
  };
  rec.onerror=e=>{$('heard').textContent='Mic problem: '+e.error+'. Allow microphone access, or type instead.'};
  rec.onend=()=>{
    live=false;$('mic').classList.remove('live');
    if(step===1&&$('name').value){step=2;say('Thanks. Now say your phone number.');setTimeout(listen,2200)}
    else if(step===2&&$('phone').value){
      $('mic').textContent='🎤 Start again';
      const p=$('phone').value;
      say('I heard '+$('name').value+', phone '+p.split('').join(' ')+'. Tap Save if correct.');
      $('heard').innerHTML='<span class="ok">Check the details, then Save.</span>';
    }else $('mic').textContent='🎤 Try again';
  };
  rec.start();
}
$('mic').onclick=()=>{
  if(live){rec.stop();return}
  if(step===0||step>2||($('name').value&&$('phone').value)){step=1;$('name').value='';$('phone').value='';say('Please say your name.');setTimeout(listen,1500)}
  else{listen()}
};
$('save').onclick=()=>{
  const n=$('name').value.trim(),p=$('phone').value.replace(/\D/g,'');
  if(!n||p.length<7){$('heard').textContent='Enter a name and a phone number of at least 7 digits.';return}
  list.unshift({name:n,phone:p,time:new Date().toLocaleString()});persist();render();
  $('name').value='';$('phone').value='';step=0;$('mic').textContent='🎤 Start';
  say('Registered. Thank you!');$('heard').innerHTML='<span class="ok">Saved.</span>';
};
$('clear').onclick=()=>{try{rec&&rec.abort()}catch(e){}$('name').value='';$('phone').value='';step=0;$('heard').textContent='';$('mic').textContent='🎤 Start';$('prompt').textContent='Tap “Start” to register.'};
$('csv').onclick=()=>{
  const csv='Name,Phone,Time\n'+list.map(r=>[r.name,r.phone,r.time].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='registrations.csv';a.click();
};
render();
</script>
</body>
</html>
